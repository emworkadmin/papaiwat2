[register_activate]
subject="ยืนยันการลงทะเบียน"
body="
<div style='width: 600px; display: block; margin-right: auto; margin-left: auto;'>
	<div>
	</div>
	<div style='padding: 10px 15px; font-size: 0.9em;'>		
		<p>สวัสดี, {fullname}</p>
		<p>เรายินดีต้อนรับสมาชิกใหม่</p>
		<p>
			การลงทะเบียนใกล้เสร็จสมบูรณ์แล้ว<br />
			โปรดยืนยันอีเมล์ของคุณโดยคลิกที่ลิงค์ด้านล่างนี้ (หรือคัดลอกลิงค์นี้ไปเปิดที่บราวเซอร์)<br /><br />
			<a href='{url}' target='_blank'>{url}</a><br />
		</p>
	</div>
	<div>
	</div>
</div>
"


[register_finish]
subject="เสร็จสิ้นการลงทะเบียน"
body="
<div style='width: 600px; display: block; margin-right: auto; margin-left: auto;'>
	<div>
	</div>
	<div style='padding: 10px 15px; font-size: 0.9em;'>		
		<p>สวัสดี, {fullname}</p>
		<p>เรายินดีต้อนรับสมาชิกใหม่</p>
		<p>
			การลงทะเบียนเสร็จสิ้นแล้ว<br />
			คุณสามารถเข้าใช้งานได้จากลิงค์ที่อยู่ด้านล่างนี้<br />
			<a href='{login_url}' target='_blank'>{login_url}</a><br /><br />
			หรือไปยังหน้าแรกจากลิงค์ที่อยู่ด้านล่างนี้<br />
			<a href='{home_url}' target='_blank'>{home_url}</a><br />
		</p>
	</div>
	<div>
	</div>
</div>
"


[forgetpassword_activate]
subject="ยืนยันการเปลี่ยนรหัสผ่าน"
body="
<div style='width: 600px; display: block; margin-right: auto; margin-left: auto;'>
	<div>
	</div>
	<div style='padding: 10px 15px; font-size: 0.9em;'>		
		<p>สวัสดี, {fullname}</p>
		<p>UserID คือ {userid}</p>
		<p>เราได้รับคำร้องขอเนื่องจากลืมรหัสผ่าน ดำเนินการขั้นตอนต่อไปนี้หากคุณได้ร้องขอมา</p>
		<p>โปรดเพิกเฉยอีเมล์ฉบับนี้หากไม่ได้เป็นคำร้องจากท่าน บัญชีผู้ใช้งานของท่านยังสามารถใช้งานได้ปกติ</p>
		<p>
			คลิกที่ลิงค์ด้านล่างนี้เพื่อตั้งรหัสผ่านใหม่ (หรือคัดลอกลิงค์นี้ไปเปิดที่บราวเซอร์)<br />
			<a href='{url}' target='_blank'>{url}</a><br /><br />
		</p>
	</div>
	<div>
	</div>
</div>
"



