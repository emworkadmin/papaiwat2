[new_question_user_th]
subject="ระบบ {site_name} ได้รับข้อมูลคำถามของท่านเรียบร้อยแล้ว"
body="
<div style='width: 600px; display: block;'>
	<div>
		<img alt="image" src='{header_image_url}' />
	</div>
	<div style='padding: 10px 15px; font-size: 0.9em;'>	
		<p>
			<strong>เรื่อง   ระบบ {site_name} ได้รับข้อมูลคำถามของท่านเรียบร้อยแล้ว</strong>
		<p>
		</p>
			<strong>เรียนคุณ {sender_name}</strong>
		</p>
		<p style='padding-left: 15px; padding-right: 15px;'>
			คำถามของท่านถูกส่งเข้าสู่ระบบแล้ว
		</p>
		<p style='padding-left: 15px; padding-right: 15px;'>
			เจ้าหน้าที่จะดำเนินการตรวจสอบและตอบคำถามของท่านผ่านช่องทางอีเมล์ที่ท่านแจ้งโดยเร็วที่สุด
		</p>
		<p>
			<strong>ขอขอบคุณสำหรับคำถาม</strong>
		</p>
		<p>
			<strong>{site_name}</strong>
		</p>
	</div>
	<div>
		<img alt="image" src='{footer_image_url}' />
	</div>
</div>
"

