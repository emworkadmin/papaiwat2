[new_question_admin]
subject="ระบบ {site_name} ได้รับข้อมูลคำถามใหม่จากคุณ {sender_name}"
body="
<div style='width: 600px; display: block;'>
	<div>
		<img alt="image" src='{header_image_url}' />
	</div>
	<div style='padding: 10px 15px; font-size: 0.9em;'>	
		<p>
			<strong>เรื่อง ระบบ {site_name} ได้รับข้อมูลคำถามใหม่จากคุณ {sender_name}</strong>
		<p>
		</p>
			<strong>เรียน คุณ{admin_name}</strong>
		</p>
		<p style='padding-left: 15px; padding-right: 15px;'>
			 มีคำถามใหม่จากคุณ {sender_name}
		</p>
		<p style='padding-left: 15px; padding-right: 15px;'>
			กรุณาตรวจสอบข้อมูลได้ที่ <a href='{link_url}'>คลิกที่นี่</a>
		</p>
		<p>
			<strong>{site_name}</strong>
		</p>
	</div>
	<div>
		<img alt="image" src='{footer_image_url}' />
	</div>
</div>
"