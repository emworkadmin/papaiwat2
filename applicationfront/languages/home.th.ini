;thainessdesc
thainessdesc_title="ท่องเที่ยววิถีไทย<br />ในชุมชนวิถีพอเพียง"
thainessdesc_desc1="คำว่า “วิถีไทย” เป็นคำที่สะท้อนถึงทุกสิ่งทุกอย่างของชาติไทยได้อย่างชัดเจน ไม่ว่าจะเป็นผู้คน ประเพณี วิถีชีวิต สถาปัตยกรรม ธรรมชาติ ภาษา อาหาร การแต่งกาย สิ่งต่างๆเหล่านี้ได้รับการสืบสาน จากรุ่นสู่รุ่น และการที่ชุมชนจะอยู่ได้อย่างยั่งยืนนั้น ชาวบ้านจำเป็นต้องศึกษาและเรียนรู้วิถีการดำเนินชีวิต"
thainessdesc_desc2="ตามแนวพระราชดำริเศรษฐกิจพอเพียงของพระบาทสมเด็จพระปรมินทรมหาภูมิพลอดุลยเดช รัชกาลที่ 9 ซึ่งเป็นศาสตร์ที่เรียบง่าย มีความยืดหยุ่น ทำให้ชุมชนเข้มแข็ง มีคุณภาพชีวิตที่ดีขึ้น ซึ่งเป็นแนวทางในการยกระดับคุณภาพชีวิตของคนในชุมชนได้อย่างยั่งยืน ควบคู่ไปกับเทคโนโลยีและวิทยาการสมัยใหม่ สิ่งเหล่านี้ เป็นสิ่งสำคัญที่ดึงดูดให้นักท่องเที่ยวได้เข้ามาเรียนรู้ สัมผัสวิถีไทยอย่างใกล้ชิดและลึกซึ้ง"

