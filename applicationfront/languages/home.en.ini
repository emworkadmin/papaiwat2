thainessdesc_title="Thainess Attractions<br /> in the Sufficient Community"
thainessdesc_desc1="“Thainess” is a reflection of Thai people, traditions, ways of life, architectures, nature, language, foods, dresses and all these “Thainess” have been preserved from ages to ages. For sustainability, locals need to learn and study the precious Thai way of life. "
thainessdesc_desc2="Sufficiency Economy of His Majesty King Bhumibol Adulyadej is a simple, flexible and incredibly effective to help improve people’s quality of life and develop to a stronger community. Along with modern technology, these are important and charm to attract tourists to discover the fascinated experience of Thainess."
