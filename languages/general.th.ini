;Agreement
agreement_title="ข้อกำหนดการให้บริการของเว็บไซต์ IP Mart"
agreement_line_01='ในข้อตกลงนี้<br />
“ผู้ใช้งาน” หมายถึง ผู้ใช้บริการเว็บไซต์ IP Mart ผู้ซื้อสินค้า และผู้ขายสินค้าผ่านเว็บไซต์ IP Mart (www.thaiipmart.com)<br />
“ขาย” หมายความรวมถึง โอนสิทธิ อนุญาตให้ใช้สิทธิ และซื้อขายสินค้า<br />
“ผู้ขาย” หมายความถึง ผู้ลงประกาศเพื่อการโอนสิทธิ อนุญาตให้ใช้สิทธิในทรัพย์สินทางปัญญา หรือซื้อขายสินค้าในเว็บไซต์ IP Mart
'
agreement_line_02='
ผู้ขายจะต้องเป็นเจ้าของหรือผู้ทรงสิทธิในทรัพย์สินทางปัญญานั้น หรือเป็นเจ้าของกรรมสิทธิ์     ในสินค้า โดยอาจดำเนินการลงประกาศเองหรือมอบหมายให้บุคคลอื่นดำเนินการลงประกาศให้ก็ได้<br /><br />
ทรัพย์สินทางปัญญาที่จะลงประกาศในเว็บไซต์นี้ ได้แก่ ลิขสิทธิ์ สิทธิบัตร อนุสิทธิบัตร เครื่องหมายการค้า ความลับทางการค้า แบบผังภูมิวงจรรวม ที่ยังมีอายุความคุ้มครองตามกฎหมายทรัพย์สินทางปัญญา ว่าด้วยการนั้นอยู่<br /><br />
สินค้าที่จะลงประกาศในเว็บไซต์นี้ ได้แก่ สินค้าสิ่งบ่งชี้ทางภูมิศาสตร์ และสินค้าอื่นๆ ที่ผลิตขึ้นโดยใช้ทรัพย์สินทางปัญญาที่ยังมีอายุความคุ้มครองอยู่ และให้หมายความรวมถึงการให้บริการที่มีทรัพย์สินทางปัญญาคุ้มครองอยู่<br /><br />
ในการนี้ ผู้ขายจะต้องแสดงสำเนาหนังสือสำคัญการจดทะเบียน หรือเอกสารแสดงสิทธิในทรัพย์สินทางปัญญาที่กรมทรัพย์สินทางปัญญาออกให้เพื่อยืนยันความเป็นเจ้าของหรือเป็นผู้ทรงสิทธิด้วย
'
agreement_line_03='
ห้ามลงประกาศด้วยข้อมูลอันเป็นเท็จ เกินความจริง ฉ้อฉล หรือหลอกลวงให้ผู้อื่นหลงเชื่อในสถานะ สภาพ สาระสำคัญของสิทธิในทรัพย์สินทางปัญญา แหล่งกำเนิด คุณภาพ คุณสมบัติ หรือปริมาณของสินค้า หรือสร้างความเสียหายแก่บุคคลอื่นโดยประการใดๆ รวมถึงห้ามนำสิทธิในทรัพย์สินทางปัญญาของบุคคลอื่นมาแอบอ้างเป็นของตนด้วย<br /><br />
กรณีมีผู้ร้องเรียนว่า “ผู้ขาย” ละเมิดสิทธิในทรัพย์สินทางปัญญาบนเว็บไซต์ IP Mart กรมทรัพย์สินทางปัญญาในฐานะผู้บริหารจัดการเว็บไซต์ IP Mart จะลบประกาศหรือระงับประกาศของผู้ขายดังกล่าวออกจากเว็บไซต์ IP Mart เมื่อผู้ร้องเรียนแสดงสำเนา/หลักฐานการแจ้งความร้องทุกข์ หรือเอกสารหลักฐานอื่นที่น่าเชื่อได้ว่า “ผู้ขาย” กระทำละเมิดดังกล่าว
'
agreement_line_04='ในกรณีที่ผู้ขายประสงค์จะใช้ภาพถ่ายประกอบการลงประกาศ ภาพถ่ายนั้นต้องเป็นภาพถ่ายของตนเองที่ถ่ายจากสินค้าจริง และห้ามใช้ภาพถ่ายที่มีเครื่องหมายของเว็บไซต์อื่นที่มิใช่เว็บไซต์ของผู้ขายเอง'
agreement_line_05='ผู้ขายต้องประกาศข้อมูลการติดต่อของตนในช่องทางที่เว็บไซต์กำหนดไว้เท่านั้น'
agreement_line_06='ให้ผู้ขายลงประกาศขายสิทธิในทรัพย์สินทางปัญญาหรือสินค้ารายการหนึ่งๆ ในประกาศเพียงครั้งเดียวเท่านั้น และห้ามผู้ขายรายเดียวกันใช้บัญชีหลายบัญชีเพื่อลงประกาศซ้ำ'
agreement_line_07='ในกรณีที่ผู้ขายต้องการลงประกาศขายสิทธิในสิทธิบัตรหรืออนุสิทธิบัตร สิทธิบัตรหรืออนุสิทธิบัตรนั้นต้องได้ยื่นคำขอรับสิทธิบัตรหรืออนุสิทธิบัตร และผ่านการประกาศโฆษณาแล้วเท่านั้น'
agreement_line_08='ในกรณีที่ผู้ขายต้องการลงประกาศขายสินค้าสิ่งบ่งชี้ทางภูมิศาสตร์ (GI) สินค้าดังกล่าวต้องได้รับการขึ้นทะเบียนเป็นสิ่งบ่งชี้ทางภูมิศาสตร์แล้ว โดยผู้ขายต้องเป็นผู้ได้รับอนุญาตให้ใช้ตราสัญลักษณ์สิ่งบ่งชี้ ทางภูมิศาสตร์จากกรมทรัพย์สินทางปัญญา และให้ลงประกาศโดยใช้ชื่อสิ่งบ่งชี้ทางภูมิศาสตร์ (GI) ตามที่ได้ขึ้นทะเบียนไว้'
agreement_line_09='ในกรณีที่ทรัพย์สินทางปัญญามีเจ้าของหรือผู้ทรงสิทธิในทรัพย์สินทางปัญญามากกว่าหนึ่งคน ผู้ขายต้องแสดงหนังสือที่แสดงว่าเจ้าของหรือผู้ทรงสิทธิในทรัพย์สินทางปัญญาทุกคนได้ให้ความยินยอมในการขายแล้ว'
agreement_line_10='ในการลงประกาศ ผู้ขายมีหน้าที่ตามกฎหมายคุ้มครองผู้บริโภค ในกรณีที่ผู้ขายมีของสมนาคุณแก่ ผู้ซื้อ ให้ผู้ขายแสดงราคาของสมนาคุณให้ผู้ซื้อทราบด้วย'
agreement_line_11='ในกรณีที่มีการซื้อขายสินค้าในเว็บไซต์นี้ การตรวจสอบข้อเท็จจริง การชำระราคา การดำเนินการจดทะเบียน การส่งมอบสินค้า หรือการปฏิบัติตามเงื่อนไขใดๆ ตามที่ตกลงกันเป็นหน้าที่ของผู้ซื้อและผู้ขายเอง กรมทรัพย์สินทางปัญญามิได้มีอำนาจหน้าที่ในการบังคับให้ผู้ซื้อและผู้ขายปฏิบัติตามสัญญา'
agreement_line_12='ผู้ขายยินยอมให้กรมทรัพย์สินทางปัญญานำข้อมูลต่างๆ ซึ่งรวมถึงภาพถ่าย ข้อความ ที่ขึ้นประกาศบนเว็บไซต์นี้ไปเผยแพร่ตามที่กรมทรัพย์สินทางปัญญาเห็นสมควรเพื่อประโยชน์ในการส่งเสริมการใช้ประโยชน์ในทรัพย์สินทางปัญญา'
agreement_line_13='กรมทรัพย์สินทางปัญญา ในฐานะผู้บริหารจัดการเว็บไซต์ IP Mart สงวนสิทธิในการพิจารณาคัดเลือก สิทธิในทรัพย์สินทางปัญญาหรือสินค้า ที่จะนำลงในเว็บไซต์ IP Mart'
agreement_line_14='กรมทรัพย์สินทางปัญญา ในฐานะผู้บริหารจัดการเว็บไซต์ IP Mart มีอำนาจในการปรับปรุงแก้ไขประกาศของผู้ขายให้เหมาะสมเพื่อประโยชน์ของผู้ใช้งานเว็บไซต์โดยรวม'
agreement_line_end='หากผู้ขายฝ่าฝืน หรือมีเหตุอันควรเชื่อได้ว่าผู้ขายฝ่าฝืนข้อตกลงและเงื่อนไขในการใช้บริการเว็บไซต์นี้ ผู้ขายยินยอมให้กรมทรัพย์สินทางปัญญา ลบประกาศ ระงับการแสดงประกาศ หรือแก้ไขเปลี่ยนแปลงประกาศ รวมทั้งปิดกั้นการเข้าสู่ระบบ และระงับบัญชีสมาชิกของผู้ขายได้ โดยไม่ต้องบอกกล่าวผู้ขายล่วงหน้าและไม่ต้องรับผิดในความเสียหายอันอาจมีขึ้น ทั้งนี้ ดุลพินิจของกรมทรัพย์สินทางปัญญาให้ถือว่าเป็นที่สุด'
agreement_end='ผู้ใช้งานรับทราบ เข้าใจ และยินยอมปฏิบัติตามเงื่อนไขการให้บริการ'
